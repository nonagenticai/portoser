version: 2
updates:
  # uv, not pip: this project is locked with uv (web/backend/uv.lock). The `pip` ecosystem
  # does not read uv.lock, so it resolved a different dependency set than the one that ships.
  - package-ecosystem: uv
    directory: /web/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch
