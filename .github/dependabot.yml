version: 2
updates:
  # Re-validated 2026-11-14: `mcp` and `fastmcp` move together (fastmcp-slim 4.x requires
  # mcp>=2.3,<3), and `requires-python` is bounded so uv no longer resolves the
  # python_full_version >= '3.15' split. Both were resolver errors that made every
  # scheduled update job fail; this file is touched so GitHub re-runs the job and the
  # result is on the record.
  #
  # uv, not pip: this project is locked with uv (web/backend/uv.lock). The `pip` ecosystem
  # does not read uv.lock, so it resolved a different dependency set than the one that ships.
  - package-ecosystem: uv
    directory: /web/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch
    ignore:
      # Declared in web/backend/pyproject.toml but imported nowhere (grep: zero hits), and
      # held below 9.0 on purpose — Dependabot's <10.0 proposal was closed (PR #43). Every
      # proposal inside that ceiling resolves to the version already locked, which Dependabot
      # reports as `dependency_file_content_not_changed`: a job error on every run, and the
      # reason this repo's update job stayed red after the mcp/fastmcp fix cleared the two
      # real resolver errors.
      - dependency-name: restrictedpython

  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch
