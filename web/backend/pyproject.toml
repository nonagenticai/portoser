[project]
name = "portoser-web-backend"
version = "1.0.0"
description = "Portoser Web Interface Backend API with MCP support"
license = "Apache-2.0"
# Bounded, not open-ended: with no ceiling uv resolves every interpreter from 3.12 up,
# including the `python_full_version >= '3.15'` split, where a dependency has no
# solution — that made the whole Dependabot update job fail rather than skip a version
# this project will never run. CI is 3.12, the image is 3.14 (web/backend/.python-version).
requires-python = ">=3.12,<3.15"
dependencies = [
    # Core FastAPI
    "fastapi>=0.117.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0.2",
    "websockets>=15.0",
    "python-multipart>=0.0.18",

    # Authentication & Secrets
    "python-dotenv>=1.0.1",
    "hvac>=2.4.0",
    "python-keycloak>=5.1.1",
    "cryptography>=46.0.0",
    "bcrypt>=4.3.0",

    # MCP (Model Context Protocol). fastmcp 4 is built on mcp 2.x — the two move
    # together: fastmcp-slim[client] 4.x requires mcp>=2.3,<3, so pinning mcp<2 makes
    # every fastmcp upgrade unsatisfiable and the update job fails instead of proposing
    # one. The backend only touches `FastMCP(name=...)` (services/startup.py:427,
    # services/mcp_dependencies.py:75) and imports no mcp module directly.
    "fastmcp>=4.2.0,<5.0.0",
    "mcp>=2.3.0,<3.0.0",
    "RestrictedPython>=8.0,<9.0",

    # Database - psycopg v3 (async) with connection pool
    "psycopg[binary,pool]>=3.3.4",

    # JWT & Auth
    "pyjwt>=2.10.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",

    # Utilities
    "uuid7>=0.1.0",
    "httpx>=0.28.1",
    "sse-starlette>=2.3.4,<4.0.0",
    "redis>=6.0.0,<9.0.0",
    "typer>=0.15.0",
    "rich>=14.0.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Monitoring
    "prometheus-client>=0.22.0",
]

[tool.setuptools]
# Flat layout: top-level packages live alongside main.py.
packages = [
    "auth",
    "middleware",
    "models",
    "monitoring",
    "routers",
    "services",
    "utils",
]
py-modules = [
    "main",
    "config",
    "service_auth",
    "logging_config",
    "keycloak_client",
    "vault_client",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.14.0",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# load_test.py is a manual benchmark harness (requires aiohttp, real backend).
# Excluded from CI collection; run it explicitly: `python web/backend/tests/load_test.py`.
addopts = "--ignore=tests/load_test.py"
filterwarnings = [
    "ignore::DeprecationWarning:authlib",
    "ignore::DeprecationWarning:passlib",
    # async_property is a transitive dep via fastmcp; its module asserts
    # asyncio.iscoroutinefunction at IMPORT time, which fires a Python 3.16
    # deprecation warning. Match by both the issuing-module path and the
    # message so neither approach fails alone — pytest's filter pipeline
    # is order-sensitive and the by-module form misses warnings emitted
    # from the C-level wrapper.
    "ignore::DeprecationWarning:async_property.*",
    "ignore:.*asyncio.iscoroutinefunction.*is deprecated.*",
]
